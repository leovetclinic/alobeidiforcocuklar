name: Deploy store to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_BOOTSTRAP_USERNAME: ${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$ADMIN_BOOTSTRAP_USERNAME" || { echo "Missing ADMIN_BOOTSTRAP_USERNAME"; exit 1; }
          test -n "$ADMIN_BOOTSTRAP_PASSWORD" || { echo "Missing ADMIN_BOOTSTRAP_PASSWORD"; exit 1; }

      - name: Discover Cloudflare account
        run: |
          ACCOUNT_ID=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts \
            | jq -r '.result[0].id // empty')
          test -n "$ACCOUNT_ID" || { echo "The token cannot access a Cloudflare account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Ensure permanent D1 database
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "alobeidi-store-db") | (.uuid // .id)' | head -n1)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create alobeidi-store-db
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "alobeidi-store-db") | (.uuid // .id)' | head -n1)
          fi
          test -n "$DB_ID" || { echo "Could not resolve D1 database ID"; exit 1; }
          echo "CLOUDFLARE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Ensure permanent R2 bucket
        run: |
          if ! npx wrangler r2 bucket list | grep -q "alobeidi-store-images"; then
            npx wrangler r2 bucket create alobeidi-store-images
          fi

      - name: Build production worker
        run: npm run build

      - name: Apply safe database migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Set private admin bootstrap credentials
        run: |
          printf '%s' "$ADMIN_BOOTSTRAP_USERNAME" | npx wrangler secret put ADMIN_BOOTSTRAP_USERNAME --config dist/server/wrangler.json
          printf '%s' "$ADMIN_BOOTSTRAP_PASSWORD" | npx wrangler secret put ADMIN_BOOTSTRAP_PASSWORD --config dist/server/wrangler.json

      - name: Deploy store and attach domain
        run: npx wrangler deploy --config dist/server/wrangler.json
